<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="BoraGás - O marketplace oficial para pedir gás de cozinha GLP 13kg e água mineral com entrega rápida e rastreamento em tempo real.">
  <meta name="theme-color" content="#FF6B00">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BoraGás">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <!-- Open Graph / WhatsApp Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BoraGás - Entrega Rápida de Gás e Água">
  <meta property="og:description" content="Compare preços das distribuidoras da sua região e receba seu botijão em minutos.">
  <meta property="og:image" content="icons/Icon-512.png">

  <title>BoraGás - Delivery de Gás e Água</title>
  <link rel="manifest" href="manifest.json">

  <!-- OneSignal Web Push & PWA SDK (v16) Oficial -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "a9c40927-f12c-4baa-8f01-bb5a9f4bd059",
        serviceWorkerParam: { scope: "/" },
        serviceWorkerPath: "OneSignalSDKWorker.js",
        safari_web_id: "web.onesignal.auto.boragas",
        notifyButton: {
          enable: true,
          position: "bottom-right",
          theme: "default",
          size: "medium",
          displayPredicate: function() {
            return true;
          },
          text: {
            'tip.state.unsubscribed': 'Receber notificações de status e promoções BoraGás',
            'tip.state.subscribed': "Você está inscrito para receber notificações!",
            'tip.state.blocked': "Você bloqueou as notificações",
            'message.prenotify': 'Clique para receber alertas do seu gás em tempo real',
            'message.action.subscribed': "Obrigado por se inscrever!",
            'dialog.main.title': 'Notificações BoraGás',
            'dialog.main.button.subscribe': 'Permitir',
            'dialog.main.button.unsubscribe': 'Cancelar'
          }
        },
        allowLocalhostAsSecureOrigin: true,
      });

      console.log("✅ OneSignal BoraGás PWA inicializado com sucesso!");

      // Solicita permissão suavemente após carregamento inicial
      setTimeout(async () => {
        try {
          if (OneSignal.Notifications && !OneSignal.Notifications.permission) {
            await OneSignal.Slidedown.promptPush();
          }
        } catch (_) {}
      }, 3500);
    });

    // Helpers globais para comunicação bidirecional com o Flutter
    window.boragasPushRequestPermission = async function() {
      if (window.OneSignal && window.OneSignal.Notifications) {
        return await window.OneSignal.Notifications.requestPermission();
      }
      return false;
    };

    window.boragasPushLogin = async function(userId) {
      if (window.OneSignal && userId) {
        await window.OneSignal.login(userId);
        console.log("✅ OneSignal vinculado ao usuário:", userId);
        return true;
      }
      return false;
    };

    window.boragasPushLogout = async function() {
      if (window.OneSignal) {
        await window.OneSignal.logout();
        return true;
      }
      return false;
    };

    window.boragasGetSubscriptionId = function() {
      if (window.OneSignal && window.OneSignal.User && window.OneSignal.User.pushSubscription) {
        return window.OneSignal.User.pushSubscription.id || null;
      }
      return null;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
